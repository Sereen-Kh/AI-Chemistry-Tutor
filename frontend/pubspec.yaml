name: ai_chemistry_tutor
description: AI-powered chemistry tutoring app — Flutter frontend
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP client — pick one when decided ──────────────────────────────────────
  # dio: ^5.4.3
  http: ^1.2.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^13.2.1

  # ── State management — TBD by team ───────────────────────────────────────────
  # Chatbot currently uses Provider. Team will decide whether to keep or replace.
  provider: ^6.1.2
  # flutter_riverpod: ^2.5.1
  # flutter_bloc: ^8.1.5
  # get: ^4.6.6

  # ── Utilities ────────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
